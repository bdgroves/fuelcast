name: FuelCast Daily

on:
  schedule:
    # 12:00 UTC daily = 5am PDT / 4am PST
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuelcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          # Cache by pixi.lock; if lockfile missing, skip cache rather than fail
          cache: ${{ hashFiles('pixi.lock') != '' }}
          # Use frozen if lockfile exists, otherwise let pixi resolve
          frozen: ${{ hashFiles('pixi.lock') != '' }}

      # HRV4Training export from Dropbox, trimmed to the columns FuelCast
      # uses. Skips cleanly until the secrets exist, and never fails the job:
      # on any problem the previously committed file is used instead.
      - name: Fetch HRV4Training from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_HRV_PATH: ${{ vars.DROPBOX_HRV_PATH }}
          PYTHONPATH: src
        run: pixi run python -m fuelcast.sources.dropbox_hrv

      - name: Run FuelCast
        env:
          TP_ICS_URL: ${{ secrets.TP_ICS_URL }}
        run: pixi run fuelcast

      - name: Commit and push if changed
        run: |
          git config user.name "fuelcast-bot"
          git config user.email "fuelcast@brooksgroves.com"
          # today.json plus the trimmed HRV file (six columns, nothing private).
          git add data/today.json data/hrv4training.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fuelcast: daily plan $(date -u +'%Y-%m-%d')"
            git push
          fi
